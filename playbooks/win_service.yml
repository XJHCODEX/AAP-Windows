---
- name: Manage a Windows service
  hosts: l2-windows
  gather_facts: false
  tasks:
    - name: "Set service {{ service_name | default('Spooler') }} to {{ service_state | default('started') }}"
      ansible.windows.win_service:
        name: "{{ service_name | default('Spooler') }}"
        state: "{{ service_state | default('started') }}"
