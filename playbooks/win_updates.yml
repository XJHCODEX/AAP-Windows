---
- name: Install Windows updates
  hosts: l2-windows
  gather_facts: true
  vars:
    category_names:
      - SecurityUpdates
      - CriticalUpdates
  tasks:
    - name: Search and install updates (set reboot_allowed for automatic reboot if needed)
      ansible.windows.win_updates:
        category_names: "{{ category_names }}"
        reboot: "{{ reboot_allowed | default(false) | bool }}"
        state: installed
      register: update_result

    - name: Update summary
      ansible.builtin.debug:
        var: update_result
