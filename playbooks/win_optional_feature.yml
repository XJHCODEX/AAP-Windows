---
- name: Optional Windows features (optional components)
  hosts: l2-windows
  gather_facts: false
  tasks:
    - name: "Ensure optional feature {{ feature_name | default('TelnetClient') }} is {{ feature_state | default('present') }}"
      ansible.windows.win_optional_feature:
        name: "{{ feature_name | default('TelnetClient') }}"
        state: "{{ feature_state | default('present') }}"
