---
- name: Windows disk and volume facts
  hosts: l2-windows
  gather_facts: true
  tasks:
    - name: Gather Windows disk facts
      community.windows.win_disk_facts:

    - name: Disk layout summary
      ansible.builtin.debug:
        var: ansible_facts.disks
      when: ansible_facts.disks is defined

    - name: Fallback disk query (when facts omit disk structures)
      ansible.windows.win_shell: |
        Get-Disk | Select-Object Number, FriendlyName, Size, OperationalStatus, PartitionStyle |
        ConvertTo-Json -Compress
      register: disk_json
      changed_when: false
      when: ansible_facts.disks is not defined

    - name: Show Get-Disk output
      ansible.builtin.debug:
        var: disk_json.stdout_lines
      when: ansible_facts.disks is not defined
