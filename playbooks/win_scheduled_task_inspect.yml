---
- name: Inspect scheduled tasks (read-only)
  hosts: l2-windows
  gather_facts: false
  tasks:
    - name: Sample scheduled tasks
      ansible.windows.win_shell: |
        Get-ScheduledTask |
        Select-Object -First {{ scheduled_task_sample | default(20) | int }} TaskName, State |
        Format-Table -AutoSize | Out-String -Width 4096
      register: sch_out
      changed_when: false

    - name: Display scheduled tasks sample
      ansible.builtin.debug:
        msg: "{{ sch_out.stdout }}"
