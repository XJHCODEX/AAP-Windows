---
- name: Inspect scheduled tasks (read-only)
  hosts: all
  gather_facts: false
  vars:
    scheduled_task_sample: "{{ scheduled_task_sample | default(20) }}"
  tasks:
    - name: Sample scheduled tasks
      ansible.windows.win_shell: |
        Get-ScheduledTask |
          Select-Object -First {{ scheduled_task_sample | int }} TaskName, State |
          Format-Table -AutoSize | Out-String -Width 4096
      register: sch_out
      changed_when: false

    - name: Display scheduled tasks sample
      ansible.builtin.debug:
        msg: "{{ sch_out.stdout }}"
