---
- name: Reboot Windows host
  hosts: all
  gather_facts: false
  vars:
    pre_reboot_delay_sec: "{{ pre_reboot_delay_sec | default(10) }}"
    reboot_timeout_sec: "{{ reboot_timeout_sec | default(600) }}"
  tasks:
    - name: Reboot
      ansible.windows.win_reboot:
        pre_reboot_delay: "{{ pre_reboot_delay_sec | int }}"
        reboot_timeout: "{{ reboot_timeout_sec | int }}"
