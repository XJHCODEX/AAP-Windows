---
- name: Recent Windows event log entries (read-only)
  hosts: l2-windows
  gather_facts: false
  tasks:
    - name: Recent events
      ansible.windows.win_shell: |
        Get-WinEvent -LogName '{{ event_log_name | default("System") }}' -MaxEvents {{ event_max_events | default(10) | int }} |
        Select-Object TimeCreated, Id, LevelDisplayName, Message |
        Format-List | Out-String -Width 4096
      register: ev_out
      changed_when: false

    - name: Display events
      ansible.builtin.debug:
        msg: "{{ ev_out.stdout }}"
