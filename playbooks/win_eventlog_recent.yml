---
- name: Recent Windows event log entries (read-only)
  hosts: all
  gather_facts: false
  vars:
    event_log_name: "{{ event_log_name | default('System') }}"
    event_max_events: "{{ event_max_events | default(10) }}"
  tasks:
    - name: Recent events
      ansible.windows.win_shell: |
        Get-WinEvent -LogName '{{ event_log_name }}' -MaxEvents {{ event_max_events | int }} |
          Select-Object TimeCreated, Id, LevelDisplayName, Message |
          Format-List | Out-String -Width 4096
      register: ev_out
      changed_when: false

    - name: Display events
      ansible.builtin.debug:
        msg: "{{ ev_out.stdout }}"
