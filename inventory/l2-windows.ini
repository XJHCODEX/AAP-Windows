# Static inventory example for lab Windows hosts (WinRM).
# Use with: ansible-playbook -i inventory/l2-windows.ini playbooks/<playbook>.yml
# In AAP, prefer a synced inventory source; use limit "l2-windows" to match this group.

[l2-windows]
# DNS: l2-windows.bluehatlab.net
52.118.162.236

[l2-windows:vars]
remote_tmp = C:/temp
become_method = runas
ansible_shell_type = cmd
ansible_connection = winrm
